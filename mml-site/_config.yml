title: Measure Model Lead
description: "MML diagnoses why AI initiatives stall — operating model, governance, data quality, decision rights and leadership — before any transformation work begins."
url: "https://measuremodellead.co.uk"
baseurl: ""
author: "Sarah McConnell"
contact_email: "sarah.mcconnell@measuremodellead.co.uk"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - SETUP-GUIDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gemspec"
  - assets/images/NOTES.txt
  - assets/pdf/NOTES.txt
